<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173b31">
  <meta name="description" content="Make your own My 9 Waifu list.">
  <meta property="og:title" content="Make Your 9 Waifu">
  <meta property="og:description" content="Choose 9 waifu and create your own image.">
  <meta property="og:type" content="website">
  <title>Make Your 9 Waifu</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="./">My 9 Waifu</a>
      <div class="language-switch" aria-label="Language">
        <button class="lang active" data-lang="en">English</button>
        <button class="lang" data-lang="jp">日本語</button>
      </div>
    </header>

    <section class="section make-section">
      <div class="section-heading">
        <div>
          <p class="eyebrow small" data-i18n="chooseEyebrow">MAKE YOUR LIST</p>
          <h1 class="make-title" data-i18n="chooseTitle">Choose your 9 waifu</h1>
        </div>
        <div class="counter"><strong id="selectedCount">0</strong><span>/ 9</span></div>
      </div>
      <div class="toolbar">
        <label class="search-box">
          <span>⌕</span>
          <input id="searchInput" type="search" autocomplete="off" placeholder="Search waifu..." data-i18n-placeholder="searchPlaceholder">
        </label>
        <select id="elementFilter" aria-label="Filter by element">
          <option value="all">All elements</option>
          <option value="fire">Fire</option>
          <option value="water">Water</option>
          <option value="wind">Wind</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>
      <div class="selection-strip" id="selectionStrip" aria-live="polite"></div>
      <div class="character-grid" id="characterGrid"></div>
      <div class="bottom-action">
        <button id="customizeBtn" class="outline-btn" disabled data-i18n="customizeBtn">Customize costumes</button>
        <button id="generateBtn" class="primary-btn" disabled data-i18n="generateBtn">Generate my 9 waifu →</button>
      </div>
    </section>

    <footer>My 9 Waifu · <a href="./">Back to home</a></footer>
  </main>

  <div class="modal hidden" id="costumeModal" role="dialog" aria-modal="true" aria-labelledby="costumeTitle">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-card">
      <button class="close-btn" data-close-modal aria-label="Close">×</button>
      <p class="eyebrow small">COSTUME</p>
      <h2 id="costumeTitle">Choose a costume</h2>
      <div id="costumeList" class="costume-list"></div>
    </div>
  </div>

  <div class="modal hidden" id="resultModal" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
    <div class="modal-backdrop"></div>
    <div class="modal-card result-card">
      <div class="result-head">
        <div>
          <p class="eyebrow small">YOUR RESULT</p>
          <h2 id="resultTitle">My 9 Waifu</h2>
        </div>
        <button class="close-btn" id="closeResult" aria-label="Close">×</button>
      </div>
      <div class="canvas-wrap"><canvas id="resultCanvas" width="1200" height="1730"></canvas></div>
      <div class="result-actions">
        <button class="primary-btn" id="downloadBtn">Download image ↓</button>
        <button class="outline-btn" id="shareBtn">Share link ↗</button>
        <button class="text-btn" id="copyBtn">Copy share link</button>
      </div>
      <p class="muted center" id="shareStatus"></p>
    </div>
  </div>
  <script type="module" src="assets/make.js"></script>
</body>
</html>
