<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173b31">
  <meta name="description" content="Make your own My 9 Waifu list.">
  <meta property="og:title" content="Make Your 9 Waifu">
  <meta property="og:description" content="Choose 9 waifu and create your own image.">
  <meta property="og:type" content="website">
  <title>Make Your 9 Waifu</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="./">My 9 Waifu</a>
      <div class="language-switch" aria-label="Language">
        <button class="lang active" data-lang="en">English</button>
        <button class="lang" data-lang="jp">日本語</button>
      </div>
    </header>

    <section class="section make-section">
      <div class="section-heading">
        <div>
          <p class="eyebrow small" data-i18n="chooseEyebrow">MAKE YOUR LIST</p>
          <h1 class="make-title" data-i18n="chooseTitle">Choose your 9 waifu</h1>
        </div>
        <div class="counter"><strong id="selectedCount">0</strong><span>/ 9</span></div>
      </div>
      <div class="toolbar">
        <label class="search-box">
          <span>⌕</span>
          <input id="searchInput" type="search" autocomplete="off" placeholder="Search waifu..." data-i18n-placeholder="searchPlaceholder">
        </label>

      </div>
      <div class="selection-strip" id="selectionStrip" aria-live="polite"></div>
      <div class="element-filter" id="elementFilter" data-value="all" aria-label="Filter by element" role="group">
        <button class="element-btn active" type="button" data-element="all" aria-label="All elements" title="All elements">
          <span class="element-icon all-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h5v5H5zM14 5h5v5h-5zM5 14h5v5H5zM14 14h5v5h-5z"/></svg></span>
        </button>
        <button class="element-btn fire" type="button" data-element="fire" aria-label="Fire" title="Fire">
          <span class="element-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.8 2.8c.3 4.1-2.8 5.2-2.4 8.1.2 1.3 1.2 2.2 2.4 2.8-.2-2.4 1.4-4 2.8-5.2 1.8 2 3.1 4.2 3.1 7 0 4.5-3.2 7-7.4 7s-7.2-2.6-7.2-7c0-3.6 2.2-6.3 5.5-9.1-.2 2.2.2 3.7 1.2 4.7-.1-3.1 1.1-5.9 2-8.3z"/></svg></span>
        </button>
        <button class="element-btn water" type="button" data-element="water" aria-label="Water" title="Water">
          <span class="element-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5S5.2 10.1 5.2 14.3A6.8 6.8 0 0 0 19 14.3C19 10.1 12 2.5 12 2.5z"/></svg></span>
        </button>
        <button class="element-btn wind" type="button" data-element="wind" aria-label="Wind" title="Wind">
          <span class="element-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8.2h10.2c1.7 0 2.8-1 2.8-2.3S14.9 3.5 13.5 3.5c-1 0-1.8.5-2.2 1.3M3 12h15.2c1.7 0 2.8 1 2.8 2.3s-1.1 2.4-2.5 2.4c-1 0-1.8-.5-2.2-1.3M3 15.8h7.3"/></svg></span>
        </button>
        <button class="element-btn light" type="button" data-element="light" aria-label="Light" title="Light">
          <span class="element-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 1.7 6.3L20 10l-6.3 1.7L12 18l-1.7-6.3L4 10l6.3-1.7L12 2zm6.5 13.5.8 2.7 2.7.8-2.7.8-.8 2.7-.8-2.7-2.7-.8 2.7-.8.8-2.7z"/></svg></span>
        </button>
        <button class="element-btn dark" type="button" data-element="dark" aria-label="Dark" title="Dark">
          <span class="element-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.8 3.2a8.8 8.8 0 1 0 6 11.8A8.9 8.9 0 0 1 14.8 3.2z"/><path d="M8.2 7.3c2.2 1.2 3.4 3.1 3.4 5.3s-1.2 4.1-3.4 5.3c3.9.2 6.7-2.1 6.7-5.3s-2.8-5.5-6.7-5.3z"/></svg></span>
        </button>
      </div>
      <div class="character-grid" id="characterGrid"></div>
      <div class="bottom-action">
        <button id="generateBtn" class="primary-btn" disabled data-i18n="generateBtn">Generate my 9 waifu →</button>
      </div>
    </section>

    <footer>My 9 Waifu · <a href="./">Back to home</a></footer>
  </main>


  <div class="modal hidden" id="costumeModal" role="dialog" aria-modal="true" aria-labelledby="costumeModalTitle">
    <div class="modal-backdrop" id="costumeModalBackdrop"></div>
    <div class="modal-card costume-modal-card">
      <div class="result-head">
        <div>
          <p class="eyebrow small">COSTUME</p>
          <h2 id="costumeModalTitle">Choose costume</h2>
        </div>
        <button class="close-btn" id="closeCostumeModal" aria-label="Close">×</button>
      </div>
      <div class="costume-list" id="costumeModalList"></div>
    </div>
  </div>

  <div class="modal hidden" id="resultModal" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
    <div class="modal-backdrop"></div>
    <div class="modal-card result-card">
      <div class="result-head">
        <div>
          <p class="eyebrow small">YOUR RESULT</p>
          <h2 id="resultTitle">My 9 Waifu</h2>
        </div>
        <button class="close-btn" id="closeResult" aria-label="Close">×</button>
      </div>
      <div class="canvas-wrap"><canvas id="resultCanvas" width="1200" height="1730"></canvas></div>
      <div class="result-actions">
        <button class="primary-btn" id="downloadBtn">Download image ↓</button>
        <button class="outline-btn" id="shareBtn">Share link ↗</button>
        <button class="text-btn" id="copyBtn">Copy share link</button>
      </div>
      <p class="muted center" id="shareStatus"></p>
    </div>
  </div>
  <script type="module" src="assets/make.js"></script>
</body>
</html>
